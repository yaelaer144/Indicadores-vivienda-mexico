
name: Inspeccionar tablas HTML STPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Inspeccionar reporte y formularios Cognos
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          BASE = (
              "http://siel.stps.gob.mx:303/"
              "ibmcognos/cgi-bin/cognos.cgi"
          )

          PATH = (
              "/content/folder[@name='Sitio STPS']"
              "/folder[@name='2. Salarios']"
              "/folder[@name='Salario asociado a trabajadores']"
              "/report[@name='Salario por Actividad Económica']"
          )

          def escapar(s):
              resultado = []
              for b in s.encode("utf-8"):
                  if (
                      48 <= b <= 57
                      or 65 <= b <= 90
                      or 97 <= b <= 122
                      or b in (45, 46, 95)
                  ):
                      resultado.append(chr(b))
                  else:
                      resultado.append(f"*{b:02x}")
              return "".join(resultado)

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables = 0
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.formularios = []
                  self.form_actual = None
                  self.botones = []
                  self.inputs = []
                  self.selects = []

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)

                  if tag == "table":
                      self.tables += 1

                  elif tag == "tr":
                      self.row = []

                  elif tag in ("td", "th"):
                      self.cell = []

                  elif tag == "form":
                      self.form_actual = {
                          "method": a.get("method"),
                          "action": a.get("action"),
                          "id": a.get("id"),
                          "name": a.get("name"),
                          "campos": [],
                      }
                      self.formularios.append(
                          self.form_actual
                      )

                  elif tag == "input":
                      campo = {
                          "name": a.get("name", ""),
                          "type": a.get("type", ""),
                          "id": a.get("id", ""),
                      }

                      self.inputs.append(campo)

                      if (
                          self.form_actual is not None
                          and campo["type"].lower()
                          not in ("hidden", "password")
                      ):
                          self.form_actual[
                              "campos"
                          ].append(campo)

                  elif tag == "select":
                      self.selects.append({
                          "name": a.get("name"),
                          "id": a.get("id"),
                      })

                  elif tag == "button":
                      self.botones.append({
                          "id": a.get("id"),
                          "name": a.get("name"),
                          "type": a.get("type"),
                          "onclick": a.get("onclick"),
                      })

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.cell is not None:
                          valor = " ".join(
                              "".join(self.cell).split()
                          )

                          if self.row is not None:
                              self.row.append(valor)

                      self.cell = None

                  elif tag == "tr":
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

                  elif tag == "form":
                      self.form_actual = None

          objeto = (
              "XSSSTART"
              + escapar(PATH)
              + "XSSEND"
          )

          parametros = {
              "b_action": "cognosViewer",
              "ui.action": "run",
              "ui.object": objeto,
              "run.outputFormat": "HTML",
              "run.prompt": "true",
          }

          url = BASE + "?" + urllib.parse.urlencode(
              parametros,
              safe="*",
          )

          print("Consultando reporte STPS...", flush=True)

          solicitud = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html",
              },
          )

          with urllib.request.urlopen(
              solicitud,
              timeout=120,
          ) as respuesta:
              contenido = respuesta.read(
                  3 * 1024 * 1024
              )

              print(
                  "HTTP:",
                  respuesta.status,
              )
              print(
                  "Content-Type:",
                  respuesta.headers.get(
                      "Content-Type"
                  ),
              )
              print(
                  "Bytes:",
                  len(contenido),
              )

          html = contenido.decode(
              "utf-8",
              errors="replace",
          )

          parser = Inspector()
          parser.feed(html)

          print("\n=== ESTRUCTURA ===")
          print("Tablas:", parser.tables)
          print(
              "Filas detectadas:",
              len(parser.rows),
          )
          print(
              "Formularios:",
              len(parser.formularios),
          )

          print("\n=== FORMULARIOS COGNOS ===")

          for i, formulario in enumerate(
              parser.formularios, 1
          ):
              print(f"\nFormulario {i}")
              print(
                  "Metodo:",
                  formulario["method"],
              )
              print(
                  "Action:",
                  formulario["action"],
              )
              print(
                  "ID:",
                  formulario["id"],
              )
              print(
                  "Nombre:",
                  formulario["name"],
              )

              for campo in formulario[
                  "campos"
              ][:20]:
                  print("Campo:", campo)

          print("\n=== BOTONES ===")

          for boton in parser.botones[:15]:
              print(boton)

          print("\n=== CONTROLES ===")

          for termino in (
              "formWarpRequest",
              "PROMPTBUTTON_FINISH",
              "finishN",
              "p_Año",
              "p_Mes",
              "p_Nacional",
          ):
              print(
                  termino,
                  termino in html,
              )

          print("\n=== SELECTORES ===")

          for selector in parser.selects[:20]:
              print(selector)

          print("\n=== PRIMERAS FILAS ===")

          for fila in parser.rows[:8]:
              texto = [
                  celda[:150]
                  for celda in fila[:10]
              ]
              print(texto)

          print("\n=== CONSTRUCCION ===")

          encontrados = 0

          for fila in parser.rows:
              texto = " ".join(fila).lower()

              if "construcci" in texto:
                  print([
                      celda[:150]
                      for celda in fila[:15]
                  ])

                  encontrados += 1

                  if encontrados >= 5:
                      break

          print("\n=== FECHAS ===")

          texto_filas = " ".join(
              " ".join(fila)
              for fila in parser.rows
          )

          fechas = re.findall(
              r"\b20\d{2}[-/](?:0?[1-9]|1[0-2])\b",
              texto_filas,
          )

          print(
              "Fechas encontradas:",
              fechas[:20],
          )

          print("\n=== PARAMETROS COGNOS ===")

          for nombre in (
              "Año",
              "Mes",
              "Nacional",
          ):
              patron = (
                  r'"@parameter"\s*:\s*"'
                  + re.escape(nombre)
                  + r'"'
              )

              print(
                  nombre,
                  bool(re.search(patron, html)),
              )

          print("\n=== DIAGNOSTICO FINAL ===")

          if fechas and encontrados:
              print(
                  "Existen indicios de datos "
                  "mensuales en el HTML."
              )
          else:
              print(
                  "El reporte contiene controles "
                  "de parametros. Es necesario "
                  "ejecutar la seleccion para "
                  "obtener los salarios."
              )

          print(
              "\nInspeccion finalizada correctamente"
          )
          PY
