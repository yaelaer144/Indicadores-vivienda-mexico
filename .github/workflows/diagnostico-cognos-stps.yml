
name: Inspeccionar tablas HTML STPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Leer tablas del reporte STPS
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          BASE = (
              "http://siel.stps.gob.mx:303/"
              "ibmcognos/cgi-bin/cognos.cgi"
          )

          PATH = (
              "/content/folder[@name='Sitio STPS']"
              "/folder[@name='2. Salarios']"
              "/folder[@name='Salario asociado a trabajadores']"
              "/report[@name='Salario por Actividad Económica']"
          )

          def escapar(s):
              result = []
              for b in s.encode("utf-8"):
                  if (
                      48 <= b <= 57 or
                      65 <= b <= 90 or
                      97 <= b <= 122 or
                      b in (45, 46, 95)
                  ):
                      result.append(chr(b))
                  else:
                      result.append(f"*{b:02x}")
              return "".join(result)

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tables = 0
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.forms = 0
                  self.inputs = []
                  self.selects = []
                  self.current_select = None

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)

                  if tag == "table":
                      self.tables += 1
                  elif tag == "tr":
                      self.row = []
                  elif tag in ("td", "th"):
                      self.cell = []
                  elif tag == "form":
                      self.forms += 1
                  elif tag == "input":
                      self.inputs.append({
                          "name": a.get("name", ""),
                          "type": a.get("type", ""),
                      })
                  elif tag == "select":
                      self.current_select = a.get(
                          "name", ""
                      )
                      self.selects.append(
                          self.current_select
                      )

              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell.append(data)

              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      if self.cell is not None:
                          value = " ".join(
                              "".join(self.cell).split()
                          )
                          if self.row is not None:
                              self.row.append(value)
                      self.cell = None

                  elif tag == "tr":
                      if self.row:
                          self.rows.append(self.row)
                      self.row = None

          obj = "XSSSTART" + escapar(PATH) + "XSSEND"

          params = {
              "b_action": "cognosViewer",
              "ui.action": "run",
              "ui.object": obj,
              "run.outputFormat": "HTML",
              "run.prompt": "true",
          }

          url = BASE + "?" + urllib.parse.urlencode(
              params, safe="*"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html",
              }
          )

          with urllib.request.urlopen(
              req, timeout=120
          ) as r:
              raw = r.read(3 * 1024 * 1024)
              print("HTTP:", r.status)
              print(
                  "Content-Type:",
                  r.headers.get("Content-Type")
              )
              print("Bytes:", len(raw))

          html = raw.decode(
              "utf-8", errors="replace"
          )

          parser = Inspector()
          parser.feed(html)

          print("\n=== ESTRUCTURA ===")
          print("Tablas:", parser.tables)
          print("Filas detectadas:", len(parser.rows))
          print("Formularios:", parser.forms)

          print("\n=== PRIMERAS FILAS ===")
          for fila in parser.rows[:12]:
              print(fila[:12])

          print("\n=== FILAS DE CONSTRUCCION ===")
          encontradas = 0
          for fila in parser.rows:
              texto = " ".join(fila).lower()
              if "construcci" in texto:
                  print(fila[:15])
                  encontradas += 1
                  if encontradas >= 5:
                      break

          print("\n=== CAMPOS DE FORMULARIO ===")
          for campo in parser.inputs:
              if campo["type"] not in (
                  "hidden", "password"
              ):
                  print(campo)

          print("Selectores:", parser.selects[:20])

          print("\n=== FECHAS ===")
          texto_filas = " ".join(
              " ".join(fila)
              for fila in parser.rows
          )
          fechas = re.findall(
              r"\b20\d{2}[-/](?:0?[1-9]|1[0-2])\b",
              texto_filas
          )
          print("Fechas encontradas:", fechas[:20])

          print("\n=== DIAGNOSTICO ===")
          if fechas and encontradas:
              print(
                  "Hay indicios de datos tabulares "
                  "de salarios en la respuesta HTML."
              )
          else:
              print(
                  "No se confirmaron series mensuales. "
                  "Puede ser una pagina de parametros "
                  "o un visor que requiere otra solicitud."
              )
          PY
