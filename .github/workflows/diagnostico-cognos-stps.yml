
name: Probar consulta automatica STPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Consultar STPS con navegador
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          BASE = (
              "http://siel.stps.gob.mx:303/"
              "ibmcognos/cgi-bin/cognos.cgi"
          )

          PATH = (
              "/content/folder[@name='Sitio STPS']"
              "/folder[@name='2. Salarios']"
              "/folder[@name='Salario asociado a trabajadores']"
              "/report[@name='Salario por Actividad Económica']"
          )

          def escapar(s):
              out = []
              for b in s.encode("utf-8"):
                  if (
                      48 <= b <= 57
                      or 65 <= b <= 90
                      or 97 <= b <= 122
                      or b in (45, 46, 95)
                  ):
                      out.append(chr(b))
                  else:
                      out.append(f"*{b:02x}")
              return "".join(out)

          params = {
              "b_action": "cognosViewer",
              "ui.action": "run",
              "ui.object": (
                  "XSSSTART"
                  + escapar(PATH)
                  + "XSSEND"
              ),
              "run.outputFormat": "HTML",
              "run.prompt": "true",
          }

          url = BASE + "?" + urllib.parse.urlencode(
              params, safe="*"
          )

          Path("diagnostico_stps").mkdir(
              exist_ok=True
          )

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True
              )

              page = browser.new_page(
                  viewport={
                      "width": 1440,
                      "height": 1000
                  },
                  accept_downloads=True
              )

              response = page.goto(
                  url,
                  wait_until="domcontentloaded",
                  timeout=90000
              )

              print(
                  "HTTP:",
                  response.status if response else None
              )

              page.wait_for_timeout(5000)

              print(
                  "Titulo:",
                  page.title()
              )

              print(
                  "Checkboxes:",
                  page.locator(
                      "input[type=checkbox]"
                  ).count()
              )

              print(
                  "Selectores:",
                  page.locator("select").count()
              )

              print(
                  "Botones:",
                  page.locator("button").count()
              )

              page.screenshot(
                  path="diagnostico_stps/01_inicio.png",
                  full_page=True
              )

              # Año 2026: primera casilla del
              # selector de años identificada
              # en el diagnostico previo.
  
              # Seleccionar todos los años disponibles:
              # desde 2016 hasta 2026.

              casillas = page.locator(
                  "input[type=checkbox]"
              )

              print(
                  "Años disponibles:",
                  casillas.count(),
                  flush=True
              )

              if casillas.count() != 11:
                  raise RuntimeError(
                      "Se esperaban 11 años (2016-2026). "
                      "Revisar controles Cognos."
                  )

              for i in range(11):
                  casilla = page.locator(
                      "input[type=checkbox]"
                  ).nth(i)

                  if not casilla.is_checked():
                      casilla.check(
                          force=True,
                          timeout=15000
                      )

                  print(
                      f"Año seleccionado: {2026-i}",
                      flush=True
                  )

              page.wait_for_timeout(5000)

              seleccionados = page.locator(
                  "input[type=checkbox]:checked"
              ).count()

              print(
                  "Total de años seleccionados:",
                  seleccionados,
                  flush=True
              )

              if seleccionados != 11:
                  raise RuntimeError(
                      "No se seleccionaron todos los años"
                  )


              page.screenshot(
                  path="diagnostico_stps/02_anio.png",
                  full_page=True
              )

              print(
                  "Checkboxes despues del año:",
                  page.locator(
                      "input[type=checkbox]"
                  ).count()
              )

              print(
                  "Selectores despues del año:",
                  page.locator("select").count()
              )

              print(
                  "Opciones de selectores:",
                  page.locator("select").evaluate_all(
                      """els => els.map(e => ({
                        id: e.id,
                        options: [...e.options].map(
                          o => o.textContent.trim()
                        ).slice(0, 35)
                      }))"""
                  )
              )

              consultar = page.locator(
                  "button[onclick*='promptAction']"
              )

              if consultar.count():
                  print(
                      "Intentando ejecutar Consultar"
                  )

                  try:
                      consultar.first.click(
                          timeout=15000
                      )
                      page.wait_for_timeout(10000)
                  except Exception as e:
                      print(
                          "No se pudo ejecutar:",
                          str(e)[:500]
                      )
              else:
                  print(
                      "No se encontro boton Consultar"
                  )

              page.screenshot(
                  path="diagnostico_stps/03_resultado.png",
                  full_page=True
              )

              texto = page.locator("body").inner_text(
                  timeout=20000
              )

              filas = page.locator("tr")

              print("\n=== RESULTADO ===")
              print("Titulo final:", page.title())
              print("Filas HTML:", filas.count())
              print(
                  "Contiene construccion:",
                  "construcci" in texto.lower()
              )
              print(
                  "Contiene error:",
                  bool(re.search(
                      r"error|DPR-ERR|CAF-",
                      texto,
                      re.I
                  ))
              )

              print(
                  "Texto visible:",
                  texto[:3000]
              )

              print("\n=== PRIMERAS FILAS ===")

              for i in range(
                  min(filas.count(), 12)
              ):
                  print(
                      i,
                      filas.nth(i).inner_text(
                          timeout=10000
                      )[:400]
                  )

              print(
                  "\nArchivos de diagnostico generados"
              )

              browser.close()
          PY

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-cognos-navegador
          path: diagnostico_stps/
          retention-days: 7
          if-no-files-found: warn
