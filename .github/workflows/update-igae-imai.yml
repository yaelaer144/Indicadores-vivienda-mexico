
name: Actualizar IGAE e IMAI (tabulados)

on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 28 * *'

permissions:
  contents: write

concurrency:
  group: vivienda-actualizacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar navegador automatizado
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Descargar, transformar y validar tabulados INEGI
        run: python scripts/update_igae_imai.py

      - name: Reconstruir los datos que consume el dashboard
        run: python scripts/rebuild_local_data.py

      - name: Guardar históricos verificados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add igae_construccion_mensual.csv imai_construccion_mensual.csv imai_construccion_subsectores_mensual.csv igae_imai_update_status.json local-data.js

          if ! git diff --cached --quiet; then
            git commit -m 'Actualización mensual IGAE e IMAI'
            git push
          fi
