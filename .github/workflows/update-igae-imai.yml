name: Actualizar IGAE e IMAI
on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 28 * *'
permissions:
  contents: write
concurrency:
  group: update-igae-imai
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar INEGI y validar series
        env:
          INEGI_API_TOKEN: ${{ secrets.INEGI_API_TOKEN }}
          INEGI_IGAE_ID: ${{ vars.INEGI_IGAE_ID }}
          INEGI_IMAI_ID: ${{ vars.INEGI_IMAI_ID }}
          INEGI_IGAE_SOURCE: ${{ vars.INEGI_IGAE_SOURCE }}
          INEGI_IMAI_SOURCE: ${{ vars.INEGI_IMAI_SOURCE }}
        run: python scripts/update_igae_imai.py
      - name: Guardar historicos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add igae_construccion_mensual.csv imai_construccion_mensual.csv igae_imai_update_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualización mensual IGAE e IMAI'
            git push
          fi
