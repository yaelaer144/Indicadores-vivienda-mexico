
name: Revisión anual Cuenta Satélite vivienda

on:
  workflow_dispatch:

  schedule:
    - cron: '30 13 20 * *'

permissions:
  contents: write

concurrency:
  group: vivienda-actualizacion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias CSVM
        run: |
          python -m pip install openpyxl playwright
          python -m playwright install --with-deps chromium

      - name: Descargar y validar PIB de vivienda
        run: |
          python scripts/run_group.py annual update_csvm_vivienda.py

      - name: Regenerar datos y auditar historico
        if: always()
        run: |
          python scripts/rebuild_local_data.py
          python scripts/audit_coverage.py

      - name: Registrar actualizaciones
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv' '*.json' 'local-data.js'
          git diff --cached --quiet || (git commit -m "Actualizacion anual CSVM" && git push)
