
name: Actualizar IMSS trabajadores y salarios

on:
  workflow_dispatch:
    inputs:
      max_months:
        description: "Meses por ejecucion"
        required: false
        default: "12"
        type: string
      backfill_offset:
        description: "Desplazamiento del historico"
        required: false
        default: "0"
        type: string

  schedule:
    - cron: "40 14 18 * *"

permissions:
  contents: write

concurrency:
  group: vivienda-actualizacion
  cancel-in-progress: false

jobs:
  actualizar-imss:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Diagnosticar fuentes IMSS
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          fuentes = {
              "IMSS oficial": (
                  "https://datos.imss.gob.mx/group/asegurados"
              ),
              "IMSS archivo historico": (
                  "https://datos.imss.gob.mx/sites/default/files/"
                  "asg-2025-12-31.csv"
              ),
              "Datos procesados alternativos": (
                  "https://datamx.io/dataset/"
                  "924b0ba9-38cf-46d9-a152-c31779a424f6/"
                  "resource/"
                  "382fbd94-4047-437d-9c59-54cd601dfa33/"
                  "download/data.csv"
              )
          }

          for nombre, url in fuentes.items():
              print("\nProbando:", nombre, flush=True)
              try:
                  req = urllib.request.Request(
                      url,
                      method="GET",
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Range": "bytes=0-2047"
                      }
                  )
                  with urllib.request.urlopen(
                      req, timeout=30
                  ) as response:
                      print("HTTP:", response.status)
                      print("Tipo:", response.headers.get(
                          "Content-Type"
                      ))
                      print("Longitud:", response.headers.get(
                          "Content-Length"
                      ))
                      print("Rangos:", response.headers.get(
                          "Content-Range"
                      ))
                      print("Muestra:", repr(
                          response.read(200)
                      ))
              except urllib.error.HTTPError as e:
                  print("HTTP:", e.code)
              except Exception as e:
                  print("Error:", str(e))
          PY

      - name: Descargar y procesar IMSS
        env:
          IMSS_MAX_MONTHS_PER_RUN: ${{ inputs.max_months || '12' }}
          IMSS_BACKFILL_OFFSET: ${{ inputs.backfill_offset || '0' }}
          IMSS_URL_TEMPLATE: ${{ vars.IMSS_URL_TEMPLATE }}
        run: python scripts/update_imss_series.py

      - name: Reconstruir datos del dashboard
        run: python scripts/rebuild_local_data.py

      - name: Publicar CSV y diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            imss_construccion_mensual.csv \
            imss_sbc_construccion_mensual.csv \
            imss_total_mensual.csv \
            imss_update_status.json \
            local-data.js

          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion IMSS trabajadores y salarios"
            git pull --rebase
            git push
          fi

      - name: Mostrar diagnostico
        run: |
          python - <<'PY'
          import json

          with open("imss_update_status.json", encoding="utf-8") as f:
              status = json.load(f)

          print("Estado:", status["estado"])
          print("Meses intentados:", status["meses_intentados"])
          print("Meses actualizados:", status["meses_actualizados"])

          if status["estado"] == "sin_descargas_nuevas":
              print("::warning::IMSS sin nuevas descargas. Revisar errores HTTP.")
          PY
