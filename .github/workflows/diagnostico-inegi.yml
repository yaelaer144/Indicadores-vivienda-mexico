
name: Diagnostico IDs INEGI

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar identificadores
        env:
          INEGI_API_TOKEN: ${{ secrets.INEGI_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error
          import json

          token = os.getenv("INEGI_API_TOKEN", "").strip()
          if not token:
              raise SystemExit("Falta INEGI_API_TOKEN")

          ids = {
              "General": "1660002",
              "Materiales": "1660003",
              "Maquinaria": "1660004",
              "Mano de obra": "1660005",
              "Construccion": "1700226",
              "Edificacion": "1700227"
          }

          base = (
              "https://www.inegi.org.mx/app/api/"
              "indicadores/desarrolladores/jsonxml"
          )

          for nombre, indicador in ids.items():
              for fuente in ("BISE", "BIE-BISE"):
                  url = (
                      f"{base}/INDICATOR/{indicador}"
                      f"/es/00/false/{fuente}/2.0/{token}"
                      "?type=json"
                  )
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(req, timeout=40) as r:
                          data = json.load(r)
                      series = data.get("Series") or []
                      observaciones = sum(
                          len(s.get("OBSERVATIONS") or [])
                          for s in series
                      )
                      print(
                          nombre, indicador, fuente,
                          "HTTP 200",
                          "observaciones:", observaciones
                      )
                  except urllib.error.HTTPError as e:
                      print(
                          nombre, indicador, fuente,
                          "HTTP", e.code
                      )
                  except Exception as e:
                      print(
                          nombre, indicador, fuente,
                          type(e).__name__
                      )
          PY
