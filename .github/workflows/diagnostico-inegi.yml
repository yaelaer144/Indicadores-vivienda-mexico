
name: Diagnostico API INEGI

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Probar API INEGI
        env:
          INEGI_API_TOKEN: ${{ secrets.INEGI_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error
          from urllib.parse import quote

          token = os.environ.get("INEGI_API_TOKEN", "").strip()

          if not token:
              raise SystemExit("ERROR: Falta el secreto INEGI_API_TOKEN")

          base = "https://www.inegi.org.mx/app/api/indicadores/desarrolladores/jsonxml"
          token = quote(token, safe="")

          pruebas = {
              "Catalogo BISE": f"{base}/CL_INDICATOR/1002000001/es/BISE/2.0/{token}?type=json",
              "Catalogo BIE-BISE": f"{base}/CL_INDICATOR/1002000001/es/BIE-BISE/2.0/{token}?type=json",
              "Serie BISE": f"{base}/INDICATOR/1002000001/es/00/false/BISE/2.0/{token}?type=json",
              "Serie BIE-BISE": f"{base}/INDICATOR/1002000001/es/00/false/BIE-BISE/2.0/{token}?type=json"
          }

          for nombre, url in pruebas.items():
              try:
                  req = urllib.request.Request(
                      url, headers={"Accept": "application/json",
                                    "User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=40) as r:
                      print(f"{nombre}: HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  print(f"{nombre}: HTTP {e.code}")
              except Exception as e:
                  print(f"{nombre}: {type(e).__name__}")
          PY
