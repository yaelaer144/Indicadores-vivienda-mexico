
name: Publicaciones mensuales INEGI, IMSS y RUV

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 15 * *'

permissions:
  contents: write

concurrency:
  group: vivienda-actualizacion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install openpyxl pypdf

      - name: Ejecutar consultas y registrar fallos
        id: consultas
        continue-on-error: true
        env:
          INEGI_API_TOKEN: ${{ secrets.INEGI_API_TOKEN }}
        run: |
          python scripts/run_group.py monthly update_inegi_series.py:monthly update_remaining_inegi.py update_imss_series.py update_ruv_flow.py update_sniiv_kpis.py

      - name: Regenerar datos y auditar histórico
        if: always()
        run: |
          python scripts/rebuild_local_data.py
          python scripts/audit_coverage.py

      - name: Registrar actualizaciones
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv' '*.json' 'local-data.js'
          git diff --cached --quiet || (git commit -m "Actualización por frecuencia: ${{ github.workflow }}" && git push)

      - name: Informar errores de fuentes sin ocultar publicación
        if: always()
        run: |
          python - <<'PYCODE'
          import json, pathlib, sys

          p = pathlib.Path('update_monthly_status.json')

          if not p.exists():
              print('::error::No existe el reporte de actualización mensual')
              sys.exit(1)

          report = json.loads(p.read_text(encoding='utf-8'))
          failed = report.get('failed', [])

          if failed:
              print('::warning::Fuentes con problemas: ' + ', '.join(failed))
              print('Se conservaron datos previos cuando el extractor no pudo actualizarlos.')
              sys.exit(1)

          print('Todas las consultas mensuales finalizaron correctamente.')
          PYCODE
