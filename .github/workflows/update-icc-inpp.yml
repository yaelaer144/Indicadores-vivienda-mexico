name: Actualizar ICC e INPP (INEGI)

on:
  workflow_dispatch:
  schedule:
    # Reintentos mensuales tras la publicación de índices de precios.
    - cron: '20 16 10,15,20 * *'

permissions:
  contents: write

concurrency:
  group: vivienda-actualizacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener archivos existentes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador automatizado
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Descargar y validar ICC e INPP desde INEGI
        run: python scripts/update_icc_inpp.py
      - name: Guardar diagnóstico ICC e INPP
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-icc-inpp
          path: icc_inpp_diagnostico/
          if-no-files-found: warn
          retention-days: 7
      - name: Reconstruir datos del dashboard
        run: python scripts/rebuild_local_data.py
      - name: Revisar sintaxis de JavaScript
        run: node --check local-data.js
      - name: Incorporar históricos al repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icc_incevis_base2025_mensual.csv inpp_construccion_edificacion_base2025_mensual.csv icc_inpp_update_status.json local-data.js
          if git diff --cached --quiet; then
            echo 'No hay cambios en los datos.'
          else
            git commit -m 'Actualización mensual automática ICC e INPP'
            git pull --rebase
            git push
          fi
