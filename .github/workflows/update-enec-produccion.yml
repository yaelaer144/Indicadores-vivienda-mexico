name: ENEC produccion - validacion y actualizacion mensual
on:
  workflow_dispatch:
  schedule:
    - cron: '15 16 26 * *'
permissions:
  contents: write
concurrency:
  group: vivienda-actualizacion
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar ENEC PxWeb y sustituir historico oficial
        id: consultar
        continue-on-error: true
        run: python scripts/update_enec_produccion.py
      - name: Reconstruir datos del dashboard
        if: steps.consultar.outcome == 'success'
        run: python scripts/rebuild_local_data.py
      - name: Guardar CSV y diagnostico
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in enec_actividad_historica.csv enec_produccion_update_status.json local-data.js enec_produccion_inegi_original.json enec_produccion_inegi.xlsx; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar ENEC produccion desde tabulados INEGI'
            git pull --rebase
            git push
          fi
      - name: Informar error de validacion
        if: steps.consultar.outcome != 'success'
        run: exit 1
