
name: Verificar estructura DataMX IMSS

on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Inspeccionar CSV de DataMX
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          from collections import Counter

          url = (
              "https://datamx.io/dataset/"
              "924b0ba9-38cf-46d9-a152-c31779a424f6/"
              "resource/"
              "382fbd94-4047-437d-9c59-54cd601dfa33/"
              "download/data.csv"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Indicadores-Vivienda/1.0"
              }
          )

          with urllib.request.urlopen(
              req, timeout=120
          ) as response:

              print("HTTP:", response.status)
              print(
                  "Tamaño:",
                  response.headers.get("Content-Length")
              )

              # Leer una muestra sin almacenar el CSV completo.
              text = io.TextIOWrapper(
                  response,
                  encoding="utf-8-sig",
                  errors="replace",
                  newline=""
              )

              reader = csv.DictReader(text)
              print("\nCOLUMNAS:")
              print(reader.fieldnames)

              if not reader.fieldnames:
                  raise RuntimeError("CSV sin encabezados")

              campos = {
                  c.lower(): c
                  for c in reader.fieldnames
              }

              periodo = campos.get("periodo")
              sector = campos.get("sector_economico")
              subsector = campos.get("subsector_economico")

              periodos = Counter()
              sectores = Counter()
              subsectores = Counter()

              print("\nPRIMERAS 3 FILAS:")

              for i, row in enumerate(reader):
                  if i < 3:
                      print(row)

                  if periodo:
                      periodos[row[periodo]] += 1
                  if sector:
                      sectores[row[sector]] += 1
                  if subsector:
                      subsectores[row[subsector]] += 1

                  if i >= 4999:
                      break

              print("\nPERIODOS EN LA MUESTRA:")
              print(periodos.most_common(20))

              print("\nSECTORES EN LA MUESTRA:")
              print(sectores.most_common(30))

              print("\nSUBSECTORES EN LA MUESTRA:")
              print(subsectores.most_common(20))

              print("\nInspeccion terminada.")
          PY
