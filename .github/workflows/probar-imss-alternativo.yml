
name: Validar historico IMSS DataMX

on:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Validar series historicas IMSS
        run: |
          python - <<'PY'
          import csv
          import io
          import re
          import urllib.request
          from collections import defaultdict

          url = (
              "https://datamx.io/dataset/"
              "924b0ba9-38cf-46d9-a152-c31779a424f6/"
              "resource/"
              "382fbd94-4047-437d-9c59-54cd601dfa33/"
              "download/data.csv"
          )

          totales = defaultdict(int)
          construccion = defaultdict(int)
          masa_construccion = defaultdict(float)
          filas_periodo = defaultdict(int)
          sectores = defaultdict(int)
          sexos = set()
          entidades = set()
          filas = 0

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Indicadores-Vivienda/1.0"
              }
          )

          with urllib.request.urlopen(
              req, timeout=180
          ) as response:

              print("HTTP:", response.status, flush=True)
              print(
                  "Tamaño:",
                  response.headers.get("Content-Length"),
                  flush=True
              )

              text = io.TextIOWrapper(
                  response,
                  encoding="utf-8-sig",
                  errors="replace",
                  newline=""
              )

              reader = csv.DictReader(text)

              requeridas = {
                  "PERIODO", "CVE_ENT", "SEXO",
                  "SECTOR", "TOTAL", "MASA_SALARIAL_TOTAL"
              }

              faltantes = requeridas - set(
                  reader.fieldnames or []
              )

              if faltantes:
                  raise ValueError(
                      "Columnas faltantes: " + str(faltantes)
                  )

              for row in reader:
                  periodo = row["PERIODO"].strip()

                  if not re.fullmatch(
                      r"\d{4}-\d{2}", periodo
                  ):
                      continue

                  if periodo < "2016-01":
                      continue

                  sector = row["SECTOR"].strip()
                  sexo = row["SEXO"].strip()
                  entidad = row["CVE_ENT"].strip()

                  total = int(float(row["TOTAL"] or 0))
                  masa = float(
                      row["MASA_SALARIAL_TOTAL"] or 0
                  )

                  filas += 1
                  totales[periodo] += total
                  filas_periodo[periodo] += 1
                  sectores[sector] += total
                  sexos.add(sexo)
                  entidades.add(entidad)

                  if sector == "4":
                      construccion[periodo] += total
                      masa_construccion[periodo] += masa

                  if filas % 500000 == 0:
                      print(
                          "Filas procesadas:",
                          filas,
                          flush=True
                      )

          periodos = sorted(totales)

          if not periodos:
              raise RuntimeError(
                  "No hay observaciones desde 2016"
              )

          print("\n====== COBERTURA ======")
          print("Primer mes:", periodos[0])
          print("Último mes:", periodos[-1])
          print("Número de meses:", len(periodos))
          print("Filas procesadas:", filas)
          print("Códigos SEXO:", sorted(sexos))
          print("Entidades:", sorted(entidades))

          print("\n====== SECTORES ======")
          for sector, valor in sorted(sectores.items()):
              print(sector, valor)

          print("\n====== ÚLTIMOS 12 MESES ======")
          for p in periodos[-12:]:
              print({
                  "periodo": p,
                  "puestos_nacional": totales[p],
                  "puestos_construccion": construccion[p],
                  "masa_salarial_construccion":
                      round(masa_construccion[p], 2),
                  "filas": filas_periodo[p]
              })

          print("\n====== VALIDACIONES ======")

          anomalos = [
              p for p in periodos
              if construccion[p] <= 0
              or totales[p] < construccion[p]
          ]

          print("Meses con anomalías:", anomalos)

          if anomalos:
              raise RuntimeError(
                  "Se detectaron agregados inválidos"
              )

          print("Validación exploratoria terminada")
          PY
