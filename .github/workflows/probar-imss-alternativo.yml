                  )
              )
              print("Acceso parcial confirmado")
          else:
              print(
                  "El servidor no confirmó descarga "
                  "parcial. No se descarga el archivo "
                  "completo en esta prueba."
              )
  
  except urllib.error.HTTPError as e:
      print("HTTP:", e.code)
  except Exception as e:
      print("ERROR:", repr(e))
