
name: Diagnostico de acceso IMSS

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Probar servidores IMSS
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          urls = {
              "Portal IMSS":
                  "https://www.imss.gob.mx/",
              "Consulta dinamica IMSS":
                  "https://www.imss.gob.mx/node/94477",
              "Catalogo datos abiertos":
                  "https://datos.imss.gob.mx/group/asegurados",
              "Archivo historico IMSS":
                  "https://datos.imss.gob.mx/sites/default/files/"
                  "asg-2025-12-31.csv",
          }

          for nombre, url in urls.items():
              print("\n" + "=" * 50)
              print(nombre)
              print("URL:", url)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Range": "bytes=0-1023",
                      },
                  )

                  with urllib.request.urlopen(
                      req, timeout=25
                  ) as r:
                      print("HTTP:", r.status)
                      print(
                          "Content-Type:",
                          r.headers.get("Content-Type")
                      )
                      print("URL final:", r.url)
                      print(
                          "Content-Range:",
                          r.headers.get("Content-Range")
                      )
                      print("Muestra:", repr(r.read(120)))

              except urllib.error.HTTPError as e:
                  print("HTTP:", e.code)
                  print("URL final:", e.url)
                  print(
                      "Retry-After:",
                      e.headers.get("Retry-After")
                  )

              except Exception as e:
                  print("ERROR:", repr(e))
          PY
